[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "physics-engine"
version = "0.7.0"
description = "rtime的物理引擎：多域物理+模型生成+材料+外观的规范与共享内核（规范先行、代码后置）"
requires-python = ">=3.11"
dependencies = []
license = "MIT"
readme = "README.md"

[project.optional-dependencies]
# 数值加速档（decisions/0016甲案）：核心永不依赖它，
# 检测到才走加速实现，两实现逐字节对拍是进仓门。
accel = ["numpy>=1.24"]
dev = ["pytest>=8", "ruff>=0.15,<1", "numpy>=1.24", "pre-commit>=4"]

[project.scripts]
pe-scene = "physics_engine.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/physics_engine"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
# marker与spec/13零之二的负载三级一一对应：无marker=交互级（<1秒，永远本机跑）。
# 新案例/设施出生时在案例页申报级别，marker必须与之一致。
markers = [
    "batch: 本机批级（<2分钟，与30/120验收预算同源）",
    "serverclass: 服务器级（>2分钟或天然可并行的批；本机不跑，独立入口）",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tools/*.py" = ["E402"]
