[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "physics-engine"
version = "0.4.0"
description = "rtime的物理引擎：多域物理+模型生成+材料+外观的规范与共享内核（规范先行、代码后置）"
requires-python = ">=3.11"
dependencies = []
license = "MIT"
readme = "README.md"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.15,<1"]

[project.scripts]
pe-scene = "physics_engine.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/physics_engine"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tools/*.py" = ["E402"]
